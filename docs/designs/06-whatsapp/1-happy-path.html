<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WhatsApp booking — happy path</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1640px; height: 1400px; box-sizing: border-box; padding: 40px; background: #E9EDE7; color: #111511; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 16px; line-height: 1.45; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px; align-items: start">
<sc-for list="{{phones}}" as="p" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; font-weight: 700">{{p.label}}</div>
<div style="width: 360px; height: 1260px; background: #ECEFE8; border: 1px solid #C9CFC7; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #111511; color: #EEF2EC">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 999px; background: #9BD10F; color: #111511; display: inline-flex; align-items: center; justify-content: center; font-weight: 800">Ì</span>
<div style="flex: 1"><div style="font-weight: 700; font-size: 15px">Ìrìn Lagos Tours</div><div style="font-size: 12px; color: #A9B3A8">Booking assistant</div></div>
</div>
<div style="flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
<sc-for list="{{p.msgs}}" as="m" hint-placeholder-count="6">
<sc-if value="{{m.isSys}}" hint-placeholder-val="{{false}}"><div style="align-self: center; padding: 4px 10px; border-radius: 8px; background: #DCE2D9; font-size: 12px; color: #3B423B; text-align: center; max-width: 290px">{{m.text}}</div></sc-if>
<sc-if value="{{m.isGuest}}" hint-placeholder-val="{{false}}"><div style="align-self: flex-end; max-width: 250px; padding: 7px 10px 5px; border-radius: 12px 12px 4px 12px; background: #DDF1B4; font-size: 15px; white-space: pre-line">{{m.text}}<div style="font-size: 11px; color: #4F584F; text-align: right">{{m.time}}</div></div></sc-if>
<sc-if value="{{m.isBot}}" hint-placeholder-val="{{true}}">
<div style="align-self: flex-start; width: 290px; display: flex; flex-direction: column; gap: 3px">
<div style="padding: 8px 10px 5px; border-radius: 12px 12px 12px 4px; background: #FFFFFF; font-size: 15px">
<sc-if value="{{m.staff}}" hint-placeholder-val="{{false}}"><div style="font-size: 12px; font-weight: 700; color: #3F5A00; margin-bottom: 2px">{{m.staff}}</div></sc-if>
<sc-if value="{{m.title}}" hint-placeholder-val="{{false}}"><div style="font-weight: 700">{{m.title}}</div></sc-if>
<div style="white-space: pre-line">{{m.text}}</div>
<sc-if value="{{m.link}}" hint-placeholder-val="{{false}}"><div style="margin-top: 6px; border-radius: 8px; background: #F4F6F3; border-left: 0; padding: 8px 10px"><div style="font-weight: 700; font-size: 14px">{{m.linkTitle}}</div><div style="font-size: 13px; color: #4F584F">{{m.linkDesc}}</div><div style="font-size: 13px; color: #3F5A00; text-decoration: underline; word-break: break-all">{{m.link}}</div></div></sc-if>
<div style="font-size: 11px; color: #4F584F; text-align: right">{{m.time}}</div>
</div>
<sc-for list="{{m.buttons}}" as="b" hint-placeholder-count="0"><button type="button" style="min-height: 40px; border: 0; border-radius: 10px; background: #FFFFFF; color: #3F5A00; font-size: 15px; font-weight: 700">{{b}}</button></sc-for>
<sc-if value="{{m.list}}" hint-placeholder-val="{{false}}"><button type="button" style="min-height: 40px; border: 0; border-radius: 10px; background: #FFFFFF; color: #3F5A00; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3F5A00" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"></path></svg>{{m.list}}</button></sc-if>
</div>
</sc-if>
<sc-if value="{{m.isImg}}" hint-placeholder-val="{{false}}">
<div style="align-self: flex-start; width: 230px; padding: 6px; border-radius: 12px 12px 12px 4px; background: #FFFFFF">
<div role="img" aria-label="QR ticket" style="height: 200px; border-radius: 8px; background: #FFFFFF; border: 1px solid #DCE2D9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<div style="width: 130px; height: 130px; display: grid; grid-template-columns: repeat(21, minmax(0, 1fr))"><sc-for list="{{qr}}" as="q" hint-placeholder-count="441"><span style="background: {{q}}"></span></sc-for></div>
<div style="font-size: 14px; font-weight: 800; letter-spacing: 2px">ILT-9WD4TC</div>
<div style="font-size: 11px; color: #4F584F">Ìrìn Lagos Tours · 2 travellers</div>
</div>
<div style="font-size: 14px; padding: 6px 4px 0">{{m.text}}</div>
<div style="font-size: 11px; color: #4F584F; text-align: right">{{m.time}}</div>
</div>
</sc-if>
</sc-for>
</div>
<div style="display: flex; gap: 8px; padding: 8px 10px; background: #F4F6F3; border-top: 1px solid #DCE2D9"><div style="flex: 1; height: 40px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DCE2D9; display: flex; align-items: center; padding: 0 14px; color: #5E675E; font-size: 15px">Message</div><span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 999px; background: #9BD10F"></span></div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1640,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    const bot = (text, o) => Object.assign({ isBot: true, text, buttons: [] }, o || {});
    const me = (text, time) => ({ isGuest: true, text, time, buttons: [] });
    const sys = (text) => ({ isSys: true, text, buttons: [] });
    const n = 21, qr = [];
    const fin = (r, c) => { for (const [a, b] of [[0, 0], [0, 14], [14, 0]]) if (r >= a && r < a + 7 && c >= b && c < b + 7) { const x = r - a, y = c - b; return (x === 0 || x === 6 || y === 0 || y === 6 || (x > 1 && x < 5 && y > 1 && y < 5)) ? 1 : 0; } return -1; };
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) { const f = fin(r, c); qr.push((f >= 0 ? f : ((r * 5 + c * 11 + r * c) % 5) < 2) ? '#111511' : '#FFFFFF'); }
    return { qr, phones: [
      { label: '1–3 · Hello, tours, dates', msgs: [
        sys('Tue 17 Nov'),
        me('Hi', '10:41'),
        bot('Hi! I’m Ìrìn Lagos Tours’ booking assistant. I can show you our tours and book one for you here in the chat.', { time: '10:41', buttons: ['See tours', 'Talk to a person'] }),
        me('See tours', '10:41'),
        bot('Here are our 5 tours. Prices are per adult and include VAT.', { time: '10:41', list: 'Choose a tour' }),
        me('Street Food Crawl', '10:42'),
        bot('An evening of suya, boli, amala and puff-puff across Yaba and Surulere.\n3 h 30 min · from ₦35,000 per adult\nFree cancellation up to 48 hours before.\n\nAll the details: okapigo.app/irin-lagos-tours/lagos-street-food-crawl', { title: 'Lagos Street Food Crawl', time: '10:42', list: 'Choose a date' }),
        me('Sat 5 Dec · 18:30', '10:42')
      ] },
      { label: '4–6 · Who’s coming, extras, name', msgs: [
        bot('Sat 5 Dec at 18:30. 8 seats left.\n\nHow many adults (13 or over)?', { time: '10:42', buttons: ['1', '2', '3 or more'] }),
        me('2', '10:43'),
        bot('Anyone under 13 coming too?', { time: '10:43', buttons: ['No', 'Yes'] }),
        me('No', '10:43'),
        bot('Would you like an extra? They’re served at the stops.', { time: '10:43', list: 'See extras' }),
        me('Palm wine sampler', '10:43'),
        bot('How many palm wine samplers? ₦4,000 each, 10 left tonight.', { time: '10:43', buttons: ['1', '2', '3 or more'] }),
        me('1', '10:44'),
        bot('Added. Anything else?', { time: '10:44', buttons: ['Add another extra', 'No, that’s all'] }),
        me('No, that’s all', '10:44'),
        bot('What name should the booking be under?', { time: '10:44' }),
        me('Adaeze Okafor', '10:45'),
        bot('Thanks, Adaeze. An email for your receipt? Type it, or tap Skip.', { time: '10:45', buttons: ['Skip'] }),
        me('adaeze.okafor@example.com', '10:45')
      ] },
      { label: '7–8 · Summary, seats held, payment link', msgs: [
        bot('Lagos Street Food Crawl\nSat 5 Dec · 18:30\nMeet at Yaba Tech main gate\n\n2 adults · ₦70,000\n1 palm wine sampler · ₦4,000\nTotal ₦74,000 (includes ₦5,163 VAT)\n\nFree cancellation until Thu 3 Dec, 18:30.\nI’m holding your 2 seats until 11:15 (30 minutes).\n\nBy tapping Pay you accept the booking terms: okapigo.app/irin-lagos-tours/terms', { title: 'Your booking', time: '10:45', buttons: ['Pay ₦74,000', 'Change something', 'Cancel'] }),
        me('Pay ₦74,000', '10:46'),
        bot('Here’s your secure payment link. Pay by card or bank transfer.', { time: '10:46', link: 'okapigo.app/pay/9fT3kQ', linkTitle: 'Pay ₦74,000 · Ìrìn Lagos Tours', linkDesc: 'Street Food Crawl · Sat 5 Dec · secured by Paystack' }),
        bot('The link works while your seats are held, until 11:15. I’ll message you here as soon as the payment arrives.', { time: '10:46' }),
        sys('10:52 · Paystack confirms the test bank transfer')
      ] },
      { label: '9 · Paid: the ticket', msgs: [
        bot('Booking ILT-9WD4TC\nLagos Street Food Crawl\nSat 5 Dec · 18:30\nMeet at Yaba Tech main gate\n2 adults · 1 palm wine sampler\nPaid ₦74,000', { title: '✓ Booking confirmed', time: '10:52' }),
        { isImg: true, text: 'Your ticket. Show it to the guide at the start.', time: '10:52', buttons: [] },
        bot('Your trip page has the map, what to bring and this ticket:', { time: '10:52', link: 'okapigo.app/trip/x7QpL2', linkTitle: 'Your trip · Lagos Street Food Crawl', linkDesc: 'Sat 5 Dec · 18:30 · Yaba Tech main gate' }),
        bot('Tell us about allergies any time by replying here. Enjoy the food!', { time: '10:52', buttons: ['Book another tour', 'Talk to a person'] })
      ] }
    ] };
  }
}
</script>
</body>
</html>
