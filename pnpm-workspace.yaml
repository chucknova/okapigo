# Tells pnpm which folders are packages in this monorepo.
# Every folder under apps/ (things we run) and packages/ (code shared between apps)
# gets its own package.json and can depend on the others by name.
packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 blocks dependencies from running install scripts unless approved here (a defence
# against malicious packages). Only approve packages that genuinely need a build step.
allowBuilds:
  # Prisma's install scripts download the query engine and schema tools for your platform.
  '@prisma/engines': true
  prisma: true
  # BullMQ's optional native speed-up for message encoding. The plain-JavaScript fallback is
  # fine at our scale, so we don't run its build script.
  msgpackr-extract: false

# Force patched versions of packages we only get indirectly (pnpm "overrides").
overrides:
  # GHSA-px8p-9vwx-vf98: fflate <0.7.5 can loop forever on a malformed ZIP64 archive. We
  # get it through satori (the preview-card renderer), which only unpacks our own font
  # files, so the risk was low, but the fix is a compatible patch release.
  fflate: '>=0.7.5 <0.8.0'
  # The accessibility checker (19c) asks for axe-core ~4.14.0, which would pick the newest
  # 4.14.x; we take only releases at least two weeks old, so this pins the one from October.
  axe-core: 4.14.0
