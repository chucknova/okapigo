# Continuous Integration: runs on every push and pull request.
# If any step fails, GitHub marks the commit with a red ✗, so broken code is caught
# before it reaches the demo. The PRD asks for "tests and CI on every change".
name: CI

on:
  push:
  pull_request:

# If you push twice quickly, cancel the older run instead of running both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # "Service containers": GitHub starts real Postgres and Redis next to the job,
    # just like docker-compose.yml does on your Mac, so integration tests run for real.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: okapigo
          POSTGRES_PASSWORD: okapigo
          POSTGRES_DB: okapigo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U okapigo -d okapigo"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://okapigo:okapigo@localhost:5432/okapigo
      REDIS_URL: redis://localhost:6379
      # A throwaway value just for CI tests. Real secrets would come from GitHub's encrypted
      # "secrets", but tests don't need a real one.
      AUTH_SECRET: ci-only-test-secret-0123456789abcdef0123456789

    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version named in package.json's "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm # reuse downloaded packages between runs = faster CI

      # --frozen-lockfile: fail if package.json and pnpm-lock.yaml disagree, so CI
      # installs exactly the versions you tested locally.
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # Build the database from the committed migrations, exactly as the demo host will.
      # `migrate deploy` only applies pending migrations; it never drops data. (The tests then
      # make and migrate their OWN databases, okapigo_test and okapigo_e2e: packages/db/src/testing.js.)
      - name: Apply database migrations
        run: pnpm --filter @okapigo/db migrate:deploy

      - name: Test
        run: pnpm test

      # The guest web must build, and its first load must stay under 300 KB (PRD NFR
      # "Mobile"). The build fails if it doesn't (apps/web/scripts/check-budget.js).
      - name: Build the guest web (300 KB budget)
        run: pnpm --filter @okapigo/web build

      # End-to-end (stage 12d): a real browser books and pays through the real API, database
      # and background worker (apps/web/e2e). Playwright downloads its own Chromium here; on a
      # laptop it uses the installed Google Chrome instead.
      - name: Install the end-to-end test browser
        run: pnpm --filter @okapigo/web exec playwright install --with-deps chromium
      - name: End-to-end tests (journey 1)
        run: pnpm --filter @okapigo/web e2e

      # Dependency scanning (PRD: Security). Fails on known high/critical vulnerabilities
      # in packages that ship to production.
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high
